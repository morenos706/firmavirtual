# Despliegue de referencia: app + worker de correos + PostgreSQL.
# Ponga un proxy inverso con HTTPS (Nginx, Caddy, balanceador de nube) delante del puerto 3000.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: firmaqr
      POSTGRES_USER: firmaqr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firmaqr"]
      interval: 10s
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://firmaqr:${POSTGRES_PASSWORD}@db:5432/firmaqr?schema=public
      DIRECT_URL: postgresql://firmaqr:${POSTGRES_PASSWORD}@db:5432/firmaqr?schema=public
      STORAGE_DIR: /app/storage
    volumes: [storage:/app/storage]
    ports: ["127.0.0.1:3000:3000"]
    depends_on: { db: { condition: service_healthy } }
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://firmaqr:${POSTGRES_PASSWORD}@db:5432/firmaqr?schema=public
      DIRECT_URL: postgresql://firmaqr:${POSTGRES_PASSWORD}@db:5432/firmaqr?schema=public
      STORAGE_DIR: /app/storage
    volumes: [storage:/app/storage]
    command: ["npx", "tsx", "scripts/worker.ts"]
    depends_on: { app: { condition: service_started } }
volumes:
  pgdata:
  storage:
